<!doctype html>
<html lang="en" data-base="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — Mentora Learning Centre</title>
<meta name="description" content="Mentora Learning Centre, Negombo — tuition classes for Grades 6–13 in English and Tamil medium, online and physical.">
<meta name="theme-color" content="#2563EB">
<script>try{if(JSON.parse(localStorage.getItem('mentora-theme'))==='dark'){document.documentElement.dataset.theme='dark';document.documentElement.setAttribute('data-bs-theme','dark');}}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div id="site-header"></div>
<main id="main" tabindex="-1">
<section class="page-hero"><div class="container">
  <span class="eyebrow" data-i18n="contact.eyebrow">Contact</span>
  <h1 data-i18n="contact.title">Talk to us</h1>
  <p class="lead" data-i18n="contact.lead">The fastest way to reach us is WhatsApp. You can also call or visit the centre.</p>
</div></section>
<section class="section section-tight"><div class="container">
  <div class="row g-4 mb-5" id="contactCards"></div>
  <div class="row g-4 align-items-stretch">
    <div class="col-lg-7"><div class="map-frame" id="mapFrame"><div id="map" role="region" data-i18n-aria="contact.mapLabel"></div>
      <div class="map-ph" id="mapPh"><i class="bi bi-geo-alt-fill" aria-hidden="true"></i><span data-i18n="contact.mapLoading">Loading map…</span></div>
      <div class="map-overlay" id="mapOverlay"></div></div></div>
    <div class="col-lg-5"><div class="m-card h-100" id="complaint">
      <span class="eyebrow" data-i18n="contact.complaintEyebrow">Feedback & complaints</span><h2 class="h4" data-i18n="contact.complaintTitle">Something not right? Tell us.</h2><p class="text-muted small" data-i18n="contact.complaintLead">Complaints go directly to the admin. You will get a reference number to follow up.</p>
      <div id="complaintMount"></div></div></div>
  </div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
<script type="module" src="js/pages/contact.js"></script>
</body>
</html>
